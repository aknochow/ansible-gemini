---
# Compare Gemini 3.x models on the same tasks: correctness, token usage,
# and estimated cost — same idea as aknochow.claude's
# cost_effectiveness_comparison.yml, but across Gemini model tiers instead
# of API vs. CLI.
#
# Requirements: Vertex AI access (see README's Auth section).
#
# Usage:
#   ansible-playbook examples/model_comparison.yml \
#     -e vertex_project=your-gcp-project-id -e vertex_location=global

- name: Compare Gemini 3.x models — correctness, tokens, cost
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vertex_project: "{{ lookup('env', 'GOOGLE_CLOUD_PROJECT') }}"
    vertex_location: "{{ lookup('env', 'GOOGLE_CLOUD_LOCATION') | default('global', true) }}"

    models_to_test:
      - gemini-3-flash-preview
      - gemini-3.1-pro-preview
      - gemini-3.1-flash-lite
      - gemini-3.5-flash
      - gemini-3.5-flash-lite
      - gemini-3.6-flash

    # $ per million tokens, standard synchronous tier, <=200k tokens/request.
    # Source: multiple pricing trackers (OpenRouter, Artificial Analysis,
    # Google Cloud Vertex pricing page) cross-checked 2026-07-27. Preview
    # models (gemini-3-flash-preview, gemini-3.1-pro-preview) are not yet
    # listed on Google's own pricing page and may change before GA —
    # treat those two figures as less certain than the four GA models.
    model_pricing:
      gemini-3-flash-preview: { input: 0.50, output: 3.00 }
      gemini-3.1-pro-preview: { input: 2.00, output: 12.00 }
      gemini-3.1-flash-lite: { input: 0.25, output: 1.50 }
      gemini-3.5-flash: { input: 1.50, output: 9.00 }
      gemini-3.5-flash-lite: { input: 0.30, output: 2.50 }
      gemini-3.6-flash: { input: 1.50, output: 7.50 }

    benchmark_tasks:
      - name: math
        prompt: "What is 17 * 6? Reply with only the number."
        expected: "102"
        max_output_tokens: 32
      - name: sentiment
        prompt: "Classify the sentiment as positive, neutral, or negative: 'This collection saved me hours of work!' Reply with exactly one word."
        expected: "positive"
        max_output_tokens: 16
      - name: reasoning
        prompt: >-
          In 3 concise bullet points, explain the key tradeoffs between
          REST and gRPC for a service-to-service API.
        expected: null
        max_output_tokens: 256

  tasks:
    - name: "Math task across all models"
      aknochow.gemini.generate:
        backend: vertex
        project_id: "{{ vertex_project }}"
        location: "{{ vertex_location }}"
        model: "{{ item }}"
        max_output_tokens: "{{ benchmark_tasks[0].max_output_tokens }}"
        contents: "{{ benchmark_tasks[0].prompt }}"
      loop: "{{ models_to_test }}"
      register: math_results

    - name: "Sentiment task across all models"
      aknochow.gemini.generate:
        backend: vertex
        project_id: "{{ vertex_project }}"
        location: "{{ vertex_location }}"
        model: "{{ item }}"
        max_output_tokens: "{{ benchmark_tasks[1].max_output_tokens }}"
        contents: "{{ benchmark_tasks[1].prompt }}"
      loop: "{{ models_to_test }}"
      register: sentiment_results

    - name: "Reasoning task across all models"
      aknochow.gemini.generate:
        backend: vertex
        project_id: "{{ vertex_project }}"
        location: "{{ vertex_location }}"
        model: "{{ item }}"
        max_output_tokens: "{{ benchmark_tasks[2].max_output_tokens }}"
        contents: "{{ benchmark_tasks[2].prompt }}"
      loop: "{{ models_to_test }}"
      register: reasoning_results

    - name: Build per-model summary
      ansible.builtin.set_fact:
        model_summary: "{{ model_summary | default([]) + [entry] }}"
      loop: "{{ models_to_test }}"
      loop_control:
        index_var: idx
        label: "{{ item }}"
      vars:
        math_r: "{{ math_results.results[idx] }}"
        sentiment_r: "{{ sentiment_results.results[idx] }}"
        reasoning_r: "{{ reasoning_results.results[idx] }}"
        pricing: "{{ model_pricing[item] }}"
        total_input_tokens: "{{ (math_r.usage.prompt_token_count | int) + (sentiment_r.usage.prompt_token_count | int) + (reasoning_r.usage.prompt_token_count | int) }}"
        total_output_tokens: "{{ (math_r.usage.candidates_token_count | int) + (sentiment_r.usage.candidates_token_count | int) + (reasoning_r.usage.candidates_token_count | int) }}"
        cost_usd: "{{ ((total_input_tokens | int) * pricing.input + (total_output_tokens | int) * pricing.output) / 1000000 }}"
        entry:
          model: "{{ item }}"
          math_correct: "{{ (math_r.text | trim) == benchmark_tasks[0].expected }}"
          sentiment_correct: "{{ (sentiment_r.text | trim | lower) == benchmark_tasks[1].expected }}"
          reasoning_preview: "{{ reasoning_r.text | trim | truncate(90) }}"
          input_tokens: "{{ total_input_tokens }}"
          output_tokens: "{{ total_output_tokens }}"
          cost_usd: "{{ cost_usd | float }}"

    - name: Show per-model comparison
      ansible.builtin.debug:
        msg: >-
          {{ item.model }}:
          math={{ 'OK' if item.math_correct else 'WRONG' }}
          sentiment={{ 'OK' if item.sentiment_correct else 'WRONG' }}
          tokens={{ item.input_tokens }}in/{{ item.output_tokens }}out
          cost=${{ '%.6f' | format(item.cost_usd) }}
      loop: "{{ model_summary }}"
      loop_control:
        label: "{{ item.model }}"

    - name: Show reasoning task responses (quality is a judgment call, not scored)
      ansible.builtin.debug:
        msg: "{{ item.model }}: {{ item.reasoning_preview }}"
      loop: "{{ model_summary }}"
      loop_control:
        label: "{{ item.model }}"

    - name: Show cheapest and most expensive
      ansible.builtin.debug:
        msg:
          - "Cheapest:  {{ (model_summary | sort(attribute='cost_usd'))[0].model }} (${{ '%.6f' | format((model_summary | sort(attribute='cost_usd'))[0].cost_usd) }})"
          - "Priciest:  {{ (model_summary | sort(attribute='cost_usd'))[-1].model }} (${{ '%.6f' | format((model_summary | sort(attribute='cost_usd'))[-1].cost_usd) }})"
          - "All correct on math+sentiment: {{ model_summary | selectattr('math_correct') | selectattr('sentiment_correct') | map(attribute='model') | list }}"
